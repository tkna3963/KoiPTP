<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOIPTP</title>
    <link rel="icon" href="Items/Img/G2VPXo2bMAIf10q.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="Styles.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="MainScripts.js" defer></script>
</head>

<body>
    <div id="container">
        <div id="LeafletMap"></div>
        <div id="rightContainer">
            <img id="BackImg" src="Items/Img/baclgroundimg.jpg" alt="背景">
            <img id="KoisiImg" src="Items/Koisis/koisiwara.png" alt="こいし">
            <textarea id="KoisiText" readonly></textarea>
        </div>
    </div>

    <script>
        let MapSet;
        let PrefArea;
        let SaibunArea;
        let TsunamiArea;
        let PrefGeoJSON;
        let SaibunGeoJSON;
        let TsunamiGeoJSON;
        let EpspAreaData = null;
        const areaMarkers = new Map();
        let EpicenterMarker;


        async function MapInit() {
            MapSet = L.map('LeafletMap', { zoomControl: false, attributionControl: false }).setView([35.681236, 139.767125], 5);
            L.tileLayer('Items/Img/MapImage.png').addTo(MapSet);

            PrefArea = await fetch("Items/AreaData/Pref.geojson").then(res => res.json());
            SaibunArea = await fetch("Items/AreaData/Saibun.geojson").then(res => res.json());
            TsunamiArea = await fetch("Items/AreaData/Tsunami.geojson").then(res => res.json());

            PrefGeoJSON = L.geoJSON(PrefArea, { style: { color: "green", fillOpacity: 0.0 } }).addTo(MapSet);
            SaibunGeoJSON = L.geoJSON(SaibunArea, { style: { color: "red", fillOpacity: 0.0 } }).addTo(MapSet);
            //TsunamiGeoJSON = L.geoJSON(TsunamiArea, { style: { color: "blue", fillOpacity: 0.0 } }).addTo(MapSet);
        }

        function MapDisplay() {
            const TimeDisplay = L.control({ position: 'bottomright' });
            TimeDisplay.onAdd = function () {
                let el = L.DomUtil.create('span', 'time-display');
                el.id = 'time-display';
                el.innerHTML = '現在時刻: --:--:--';
                el.style.background = 'rgba(255, 255, 255, 0.9)';
                el.style.border = '1px solid #aaa';
                el.style.borderRadius = '8px';
                el.style.padding = '6px 10px';
                el.style.fontSize = '18px';
                el.style.fontFamily = '"Segoe UI", sans-serif';
                el.style.color = '#333';
                el.style.boxShadow = '0 2px 6px rgba(0,0,0,0.2)';
                return el;
            };
            TimeDisplay.addTo(MapSet);
            const TextAreaControl = L.control({ position: 'topleft' });
            TextAreaControl.onAdd = function () {
                const container = L.DomUtil.create('div', 'textarea-container');
                container.style.display = 'flex';
                container.style.flexDirection = 'column';
                container.style.alignItems = 'flex-start';
                container.style.background = 'rgba(255, 255, 255, 0.2)';
                container.style.padding = '6px';
                container.style.borderRadius = '8px';
                container.style.border = '1px solid #aaa';
                container.style.boxShadow = '0 2px 6px rgba(0,0,0,0.1)';
                const topRow = L.DomUtil.create('div', 'top-row', container);
                topRow.style.display = 'flex';
                topRow.style.gap = '6px';
                topRow.style.marginBottom = '6px';
                const select = L.DomUtil.create('select', 'textarea-toggle', topRow);
                const optionShow = L.DomUtil.create('option', '', select);
                optionShow.value = 'show';
                optionShow.text = '表示';
                const optionHide = L.DomUtil.create('option', '', select);
                optionHide.value = 'hide';
                optionHide.text = '非表示';
                const dataSelect = L.DomUtil.create('select', 'data-select', topRow);
                dataSelect.id = 'data-select';
                const defaultOption = L.DomUtil.create('option', '', dataSelect);
                defaultOption.value = '';
                defaultOption.text = '受信リスト';
                dataSelect.style.flex = '1';
                const textarea = L.DomUtil.create('textarea', 'custom-textarea', container);
                textarea.id = 'custom-textarea';
                textarea.style.width = Math.floor(window.innerWidth * 0.15) + 'px';
                textarea.style.height = Math.floor(window.innerHeight * 0.4) + 'px';
                textarea.style.background = 'rgba(200, 200, 200, 0.1)';
                textarea.style.border = '1px solid #aaa';
                textarea.style.borderRadius = '8px';
                textarea.style.padding = '6px';
                textarea.style.fontSize = '14px';
                textarea.style.fontFamily = '"Segoe UI", sans-serif';
                textarea.style.color = '#333';
                textarea.style.resize = 'none';
                textarea.readOnly = true;
                select.addEventListener('change', () => {
                    textarea.style.display = select.value === 'show' ? 'block' : 'none';
                });
                dataSelect.addEventListener('change', () => {
                    const index = dataSelect.value;
                    if (index !== '') {
                        textarea.value = ConvertToTelop(P2PList[index]);
                    }
                });
                window.addEventListener('resize', () => {
                    textarea.style.width = Math.floor(window.innerWidth * 0.15) + 'px';
                    textarea.style.height = Math.floor(window.innerHeight * 0.4) + 'px';
                });
                return container;
            };
            TextAreaControl.addTo(MapSet);
        }

        function P2PMap(P2PJSON) {
            areaMarkers.forEach(marker => MapSet.removeLayer(marker));
            areaMarkers.clear();
            if (EpicenterMarker) {
                MapSet.removeLayer(EpicenterMarker);
                EpicenterMarker = null;
            }
            PrefGeoJSON.eachLayer(layer => {
                layer.setStyle({
                    fillColor: "#FFFFFF",
                    fillOpacity: 0.1,
                    color: "green"
                });
            });
            if (P2PJSON === null) {
                console.log("P2PMap: すべての操作をキャンセルしました。");
                return;
            }
            const P2PCode = P2PJSON.code;
            if (P2PCode == 555) {
                CSVLoad("Items/AreaData/epsp-area.csv").then(EpspAreaData => {
                    console.table(P2PJSON);
                    const Areas = P2PJSON.areas;
                    const dataRows = EpspAreaData.slice(1);
                    const areaMap = new Map();
                    dataRows.forEach(row => {
                        const id = Number(row[1]);
                        if (!isNaN(id)) areaMap.set(id, row);
                    });
                    const normalizePrefecture = name => {
                        if (!name) return "不明";
                        if (name === "東京") return "東京都";
                        if (name === "京都") return "京都府";
                        if (name === "大阪") return "大阪府";
                        if (name === "北海道") return "北海道";
                        return name + "県";
                    };
                    const peers = Areas.map(a => a.peer);
                    const minPeer = Math.min(...peers);
                    const maxPeer = Math.max(...peers);
                    const avgPeer = peers.reduce((sum, p) => sum + p, 0) / peers.length;
                    const variance = peers.reduce((sum, p) => sum + Math.pow(p - avgPeer, 2), 0) / peers.length;
                    const stdDev = Math.sqrt(variance);
                    const coefficientOfVariation = stdDev / avgPeer;
                    const getColorByPeer = peer => {
                        let ratio;
                        if (coefficientOfVariation < 0.3 || (maxPeer - minPeer) / avgPeer < 0.5) {
                            const sortedPeers = [...peers].sort((a, b) => a - b);
                            const rank = sortedPeers.filter(p => p < peer).length;
                            ratio = rank / (peers.length - 1 || 1);
                            ratio = Math.pow(ratio, 2);
                        } else {
                            ratio = (peer - minPeer) / (maxPeer - minPeer || 1);
                        }
                        if (ratio <= 0.33) {
                            const subRatio = ratio / 0.33;
                            const r = 0;
                            const g = Math.floor(128 * subRatio + 0 * (1 - subRatio));
                            const b = Math.floor(255 * (1 - subRatio));
                            return `rgb(${r},${g},${b})`;
                        } else if (ratio <= 0.66) {
                            const subRatio = (ratio - 0.33) / 0.33;
                            const r = Math.floor(255 * subRatio);
                            const g = 128 + Math.floor((255 - 128) * (1 - subRatio));
                            const b = 0;
                            return `rgb(${r},${g},${b})`;
                        } else {
                            const subRatio = (ratio - 0.66) / 0.34;
                            const r = 255;
                            const g = Math.floor(255 * (1 - subRatio));
                            const b = 0;
                            return `rgb(${r},${g},${b})`;
                        }
                    };
                    Areas.forEach(area => {
                        const areaId = area.id;
                        const areaPeer = area.peer;
                        const matchedRow = areaMap.get(areaId);
                        if (matchedRow) {
                            const prefecture = normalizePrefecture(matchedRow[3]);
                            const latitude = Number(matchedRow[5]);
                            const longitude = Number(matchedRow[6]);
                            const icon = L.divIcon({
                                className: "peer-number-icon",
                                html: `<div style="color:white; padding: 2px 5px; border-radius: 4px;">${areaPeer}</div>`
                            });
                            const marker = L.marker([latitude, longitude], { icon: icon }).addTo(MapSet);
                            areaMarkers.set(areaId, marker);
                            let found = false;
                            PrefGeoJSON.eachLayer(layer => {
                                if (layer.feature.properties.name === prefecture && layer.feature.properties.name !== "不明") {
                                    layer.setStyle({
                                        fillColor: getColorByPeer(areaPeer),
                                        fillOpacity: 0.4,
                                        color: "black"
                                    });
                                    found = true;
                                }
                            });
                            if (!found) console.warn(`レイヤーが見つかりません: ${prefecture}`);
                        } else {
                            console.warn(`CSVにIDが見つかりません: ${areaId}`);
                        }
                    });
                });
            } else if (P2PCode === 551) {
                JSONLoad("Items/AreaData/PointSeismicIntensityLocation.json").then(PointSeismicIntensityLocation => {
                    const EpLa = P2PJSON.earthquake.hypocenter.latitude;
                    const Eplo = P2PJSON.earthquake.hypocenter.longitude;
                    const epicenterIcon = L.icon({
                        iconUrl: 'Items/Img/epicenter.png',
                        iconSize: [32, 32],
                        iconAnchor: [16, 32],
                        popupAnchor: [0, -32]
                    });
                    if (EpicenterMarker) {
                        MapSet.removeLayer(EpicenterMarker);
                    }
                    EpicenterMarker = L.marker([EpLa, Eplo], { icon: epicenterIcon })
                        .addTo(MapSet)
                        .openPopup();
                    const locationMap = {};
                    for (const key in PointSeismicIntensityLocation) {
                        const item = PointSeismicIntensityLocation[key];
                        locationMap[item.name] = item.location;
                    }
                    const AreaScale = P2PJSON.points;
                    AreaScale.forEach(area => {
                        const Addr = area.addr;
                        const Scale = area.scale;
                        const location = locationMap[Addr];
                        if (location) {
                            const color = getShindoColorByName(geetShindo(Scale));
                            const shindoIcon = L.divIcon({
                                className: 'custom-shindo-icon',
                                html: `<div style="
    background-color: ${color};
    color: #fff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 10px;
    border: 2px solid #333;
">${geetShindo(Scale).replace("震度5弱以上（推定）", "?").replace("震度", "")}</div>
`
                            });
                            L.marker(location, { icon: shindoIcon }).addTo(MapSet);
                        }
                    });
                });
            } else if (P2PCode == 9611) {
                CSVLoad("Items/AreaData/epsp-area.csv").then(EpspAreaData => {
                    const Area_Confidences = P2PJSON.area_confidences;
                    const areaMap = new Map();
                    if (Area_Confidences && Object.keys(Area_Confidences).length > 0) {
                        Object.entries(P2PJSON.area_confidences).forEach(([areaId, info]) => {
                            const row = areaMap.get(Number(areaId));
                            if (!row) { console.warn(`CSVにIDが見つかりません: ${areaId}`); return; }
                            const prefecture = normalizePrefecture(row[3]);
                            const latitude = Number(row[5]);
                            const longitude = Number(row[6]);
                            console.log(prefecture)
                        });
                    }
                });
            }

        }



        document.addEventListener("DOMContentLoaded", async () => {
            await MapInit();
            document.getElementById('KoisiText').textContent = "古明地こいし:こんにちは!\n"
            MapDisplay();
            P2PWebsocket();
        });
    </script>

</body>

</html>
