<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOIPTP</title>
    <link rel="icon" href="Items/Img/G2VPXo2bMAIf10q.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="Styles.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="MainScripts.js" defer></script>
</head>

<body>
    <div id="container">
        <div id="LeafletMap"></div>
        <div id="rightContainer">
            <img id="BackImg" src="Items/Img/baclgroundimg.jpg" alt="背景">
            <img id="KoisiImg" src="Items/Koisis/koisiwara.png" alt="こいし">
            <textarea id="KoisiText" readonly></textarea>
        </div>
    </div>

    <script>
        let MapSet;
        let PrefArea;
        let SaibunArea;
        let TsunamiArea;
        let PrefGeoJSON;
        let SaibunGeoJSON;
        let TsunamiGeoJSON;
        let EpspAreaData = null;
        const areaMarkers = new Map();
        let EpicenterMarker;
        const marker9611Map = new Map();
        let shindoMarkers = new Map();

        async function MapInit() {
            MapSet = L.map('LeafletMap', { zoomControl: false, attributionControl: false }).setView([35.681236, 139.767125], 5);
            L.tileLayer('Items/Img/MapImage.png').addTo(MapSet);

            PrefArea = await fetch("Items/AreaData/Pref.geojson").then(res => res.json());
            SaibunArea = await fetch("Items/AreaData/Saibun.geojson").then(res => res.json());
            TsunamiArea = await fetch("Items/AreaData/Tsunami.geojson").then(res => res.json());

            PrefGeoJSON = L.geoJSON(PrefArea, { style: { color: "green", fillOpacity: 0.0 } }).addTo(MapSet);
            SaibunGeoJSON = L.geoJSON(SaibunArea, { style: { color: "red", fillOpacity: 0.0 } }).addTo(MapSet);
            TsunamiGeoJSON = L.geoJSON(TsunamiArea, { style: { color: "blue", fillOpacity: 0.0 } }).addTo(MapSet);
        }

        function MapDisplay() {
            const TimeDisplay = L.control({ position: 'bottomright' });
            TimeDisplay.onAdd = function () {
                let el = L.DomUtil.create('span', 'time-display');
                el.id = 'time-display';
                el.innerHTML = '現在時刻: --:--:--';
                el.style.background = 'rgba(255, 255, 255, 0.9)';
                el.style.border = '1px solid #aaa';
                el.style.borderRadius = '8px';
                el.style.padding = '6px 10px';
                el.style.fontSize = '18px';
                el.style.fontFamily = '"Segoe UI", sans-serif';
                el.style.color = '#333';
                el.style.boxShadow = '0 2px 6px rgba(0,0,0,0.2)';
                return el;
            };
            TimeDisplay.addTo(MapSet);
            const TextAreaControl = L.control({ position: 'topleft' });
            TextAreaControl.onAdd = function () {
                const container = L.DomUtil.create('div', 'textarea-container');
                container.style.display = 'flex';
                container.style.flexDirection = 'column';
                container.style.alignItems = 'flex-start';
                container.style.background = 'rgba(255, 255, 255, 0.2)';
                container.style.padding = '6px';
                container.style.borderRadius = '8px';
                container.style.border = '1px solid #aaa';
                container.style.boxShadow = '0 2px 6px rgba(0,0,0,0.1)';
                const topRow = L.DomUtil.create('div', 'top-row', container);
                topRow.style.display = 'flex';
                topRow.style.gap = '6px';
                topRow.style.marginBottom = '6px';
                const select = L.DomUtil.create('select', 'textarea-toggle', topRow);
                const optionShow = L.DomUtil.create('option', '', select);
                optionShow.value = 'show';
                optionShow.text = '表示';
                const optionHide = L.DomUtil.create('option', '', select);
                optionHide.value = 'hide';
                optionHide.text = '非表示';
                const dataSelect = L.DomUtil.create('select', 'data-select', topRow);
                dataSelect.id = 'data-select';
                const defaultOption = L.DomUtil.create('option', '', dataSelect);
                defaultOption.value = '';
                defaultOption.text = '受信リスト';
                dataSelect.style.flex = '1';
                const textarea = L.DomUtil.create('textarea', 'custom-textarea', container);
                textarea.id = 'custom-textarea';
                textarea.style.width = Math.floor(window.innerWidth * 0.15) + 'px';
                textarea.style.height = Math.floor(window.innerHeight * 0.4) + 'px';
                textarea.style.background = 'rgba(200, 200, 200, 0.1)';
                textarea.style.border = '1px solid #aaa';
                textarea.style.borderRadius = '8px';
                textarea.style.padding = '6px';
                textarea.style.fontSize = '14px';
                textarea.style.fontFamily = '"Segoe UI", sans-serif';
                textarea.style.color = '#333';
                textarea.style.resize = 'none';
                textarea.readOnly = true;
                select.addEventListener('change', () => {
                    textarea.style.display = select.value === 'show' ? 'block' : 'none';
                });
                dataSelect.addEventListener('change', () => {
                    const index = dataSelect.value;
                    if (index !== '') {
                        textarea.value = ConvertToTelop(P2PList[index]);
                    }
                });
                window.addEventListener('resize', () => {
                    textarea.style.width = Math.floor(window.innerWidth * 0.15) + 'px';
                    textarea.style.height = Math.floor(window.innerHeight * 0.4) + 'px';
                });
                return container;
            };
            TextAreaControl.addTo(MapSet);
        }

        function P2PMap(P2PJSON) {
            areaMarkers.forEach(marker => MapSet.removeLayer(marker));
            areaMarkers.clear();
            if (EpicenterMarker) MapSet.removeLayer(EpicenterMarker), EpicenterMarker = null;
            PrefGeoJSON.eachLayer(layer => layer.setStyle({ fillColor: "#FFF", fillOpacity: 0.1, color: "green" }));
            if (P2PJSON === null) {
                areaMarkers.forEach(marker => MapSet.removeLayer(marker));
                areaMarkers.clear();
                marker9611Map.forEach(marker => MapSet.removeLayer(marker));
                marker9611Map.clear();
                shindoMarkers.forEach(marker => MapSet.removeLayer(marker));
                shindoMarkers.clear();
                if (EpicenterMarker) MapSet.removeLayer(EpicenterMarker), EpicenterMarker = null;
                PrefGeoJSON.eachLayer(layer => layer.setStyle({ fillColor: "#FFF", fillOpacity: 0.1, color: "green" }));
                SaibunGeoJSON.eachLayer(layer => layer.setStyle({ fillColor: "#FFF", fillOpacity: 0.1, color: "green" }));
                return;
            }
            const P2PCode = P2PJSON.code;
            const normalizePrefecture = name => !name ? "不明" : name === "東京" ? "東京都" : name === "京都" ? "京都府" : name === "大阪" ? "大阪府" : name === "北海道" ? "北海道" : name + "県";
            if (P2PCode == 555) {
                CSVLoad("Items/AreaData/epsp-area.csv").then(EpspAreaData => {
                    const Areas = P2PJSON.areas, areaMap = new Map();
                    EpspAreaData.slice(1).forEach(row => !isNaN(+row[1]) && areaMap.set(+row[1], row));
                    const peers = Areas.map(area => area.peer), minPeer = Math.min(...peers), maxPeer = Math.max(...peers);
                    const avgPeer = peers.reduce((sum, peer) => sum + peer, 0) / peers.length;
                    const variance = peers.reduce((sum, peer) => sum + (peer - avgPeer) ** 2, 0) / peers.length;
                    const stdDev = Math.sqrt(variance), coefficientOfVariation = stdDev / avgPeer;
                    const getColorByPeer = peer => {
                        let ratio = coefficientOfVariation < 0.3 || (maxPeer - minPeer) / avgPeer < 0.5 ?
                            (peers.filter(p => p < peer).length / (peers.length - 1 || 1)) ** 2 :
                            (peer - minPeer) / (maxPeer - minPeer || 1);
                        if (ratio <= 0.33) {
                            const subRatio = ratio / 0.33;
                            return `rgb(0,${~~(128 * subRatio)},${~~(255 * (1 - subRatio))})`;
                        } else if (ratio <= 0.66) {
                            const subRatio = (ratio - 0.33) / 0.33;
                            return `rgb(${~~(255 * subRatio)},${128 + ~~((255 - 128) * (1 - subRatio))},0)`;
                        } else {
                            const subRatio = (ratio - 0.66) / 0.34;
                            return `rgb(255,${~~(255 * (1 - subRatio))},0)`;
                        }
                    };
                    Areas.forEach(area => {
                        const matchedRow = areaMap.get(area.id);
                        if (matchedRow) {
                            const prefecture = normalizePrefecture(matchedRow[3]), latitude = +matchedRow[5], longitude = +matchedRow[6];
                            areaMarkers.set(area.id, L.marker([latitude, longitude], {
                                icon: L.divIcon({ className: "peer-number-icon", html: `<div style="color:white;padding:2px 5px;border-radius:4px">${area.peer}</div>` })
                            }).addTo(MapSet));
                            PrefGeoJSON.eachLayer(layer => layer.feature.properties.name === prefecture && prefecture !== "不明" &&
                                layer.setStyle({ fillColor: getColorByPeer(area.peer), fillOpacity: 0.4, color: "black" }));
                        }
                    });
                });
            } else if (P2PCode === 551) {
                shindoMarkers.forEach(marker => MapSet.removeLayer(marker));
                shindoMarkers.clear();
                JSONLoad("Items/AreaData/PointSeismicIntensityLocation.json").then(PointSeismicIntensityLocation => {
                    const EpLa = P2PJSON.earthquake.hypocenter.latitude, Eplo = P2PJSON.earthquake.hypocenter.longitude;
                    EpicenterMarker = L.marker([EpLa, Eplo], {
                        icon: L.icon({ iconUrl: 'Items/Img/epicenter.png', iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -32] })
                    }).addTo(MapSet).openPopup();
                    const locationMap = {};
                    for (const key in PointSeismicIntensityLocation) locationMap[PointSeismicIntensityLocation[key].name] = PointSeismicIntensityLocation[key].location;
                    P2PJSON.points.forEach(area => {
                        const location = locationMap[area.addr];
                        if (location) {
                            const Scale = area.scale, shindo = geetShindo(Scale), color = getShindoColorByName(shindo);
                            const marker = L.marker(location, {
                                icon: L.divIcon({
                                    className: 'custom-shindo-icon',
                                    html: `<div style="background-color:${color};color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:10px;border:2px solid #333">${shindo.replace("震度5弱以上（推定）", "?").replace("震度", "")}</div>`
                                })
                            }).addTo(MapSet);
                            shindoMarkers.set(area.addr, marker);
                        }
                    });
                });
            } else if (P2PCode == 9611) {
                CSVLoad("Items/AreaData/epsp-area.csv").then(EpspAreaData => {
                    const Area_Confidences = P2PJSON.area_confidences, areaMap = new Map();
                    EpspAreaData.forEach(row => areaMap.set(+row[1], row));
                    JSONLoad("Items/AreaData/P2PSaibunn.json").then(P2PSaibun => {
                        if (!Area_Confidences) return;
                        Object.entries(Area_Confidences).forEach(([areaId, info]) => {
                            const row = areaMap.get(+areaId);
                            if (!row) return;
                            const numID = +row[1], saRegion = P2PSaibun.find(p => p.NumID === numID)?.region;
                            if (!saRegion) return;
                            const count = info.count ?? 0, icon = L.divIcon({ html: `<div class="count-marker">${count}</div>`, className: '', iconSize: [40, 40], iconAnchor: [20, 20] });
                            marker9611Map.has(areaId) ? marker9611Map.get(areaId).setIcon(icon) :
                                marker9611Map.set(areaId, L.marker([+row[5], +row[6]], { icon }).addTo(MapSet));
                            SaibunGeoJSON.eachLayer(layer => layer.feature.properties.name === saRegion &&
                                layer.setStyle({ fillColor: "red", fillOpacity: 0.4, color: "red" }));
                        });
                    });
                });
            } else if (P2PCode == 556) {
                const EpLa = P2PJSON.earthquake.hypocenter.latitude, Eplo = P2PJSON.earthquake.hypocenter.longitude;
                EpicenterMarker = L.marker([EpLa, Eplo], {
                    icon: L.icon({ iconUrl: 'Items/Img/epicenter.png', iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -32] })
                }).addTo(MapSet).openPopup();
                P2PJSON.areas.forEach(area => {
                    const color = getShindoColorByName(geetShindo(area.scaleFrom));
                    SaibunGeoJSON.eachLayer(layer => layer.feature.properties.name === area.name &&
                        layer.setStyle({ fillColor: color, fillOpacity: 0.4, color }));
                });
            } else if (P2PCode == 561) {
                JSONLoad("Items/AreaData/P2PSaibunn.json").then(P2PSaibun => {
                    const Area561NumID = P2PJSON.area;
                    const areaData = P2PSaibun.find(item => item.NumID === Area561NumID);
                    const region = areaData.region;
                    EpicenterMarker = L.marker([areaData.latitude, areaData.longitude], {
                        icon: L.icon({ iconUrl: 'Items/Img/epicenter.png', iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -32] })
                    }).addTo(MapSet).openPopup();
                    SaibunGeoJSON.eachLayer(layer => {
                        if (layer.feature.properties.name === region) {
                            layer.setStyle({ fillColor: "blue", fillOpacity: 0.4, color: "blue" });
                        }
                    });
                })
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await MapInit();
            document.getElementById('KoisiText').textContent = "古明地こいし:こんにちは!\n"
            MapDisplay();
            P2PWebsocket();
        });
    </script>

</body>

</html>
