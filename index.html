<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>気象庁 XML フィードビューア</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header>
  <b>気象庁 XML フィードビューア</b>
  <small class="desktop-only">高頻度: 毎分 / 長期: 30分ごと 自動更新</small>
  <span id="NowTime"></span>
</header>

<!-- ===== フィードステータス ===== -->
<div class="statusbar-top" id="feed-status-bar">
  <span id="fst-regular">  <span class="dot loading"></span>定時</span>
  <span id="fst-extra">    <span class="dot loading"></span>随時</span>
  <span id="fst-eqvol">   <span class="dot loading"></span>地震火山</span>
  <span id="fst-other">   <span class="dot loading"></span>その他</span>
  <span class="sep">|</span>
  <span id="fst-regular_l"><span class="dot loading"></span>定時(長)</span>
  <span id="fst-extra_l">  <span class="dot loading"></span>随時(長)</span>
  <span id="fst-eqvol_l"> <span class="dot loading"></span>地震火山(長)</span>
  <span id="fst-other_l"> <span class="dot loading"></span>その他(長)</span>
  <span id="next-refresh">次回更新: —</span>
</div>

<!-- ===== ツールバー ===== -->
<div class="toolbar">
  <input id="filter-input" type="search" autocomplete="off" autocorrect="off"
         placeholder="タイトルで絞り込み..." oninput="filterEntries()">
  <button class="btn" onclick="forceRefreshAll()">更新</button>
</div>

<!-- ===== コンテンツ ===== -->
<div class="app-body">

  <!-- 左: エントリ一覧 -->
  <div class="sidebar">
    <div class="sidebar-hdr">
      <span id="sidebar-title">エントリ一覧</span>
      <span id="entry-count"></span>
    </div>
    <div class="entry-list" id="entry-list">
      <div class="sidebar-msg">初期取得中...</div>
    </div>
  </div>

  <!-- オーバーレイ (スマホ用) -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>

  <!-- 右: 詳細 / ボトムシート -->
  <div class="main" id="main-panel">
    <!-- ドラッグハンドル (スマホのみ表示) -->
    <div class="sheet-handle" onclick="closeSheet()"></div>

    <div class="main-hdr">
      <div class="url" id="url-disp">—</div>
      <div class="vtoggle">
        <button class="btn active" id="btn-raw"  onclick="setView('raw')">XML</button>
        <button class="btn"        id="btn-info" onclick="setView('info')">詳細</button>
      </div>
      <button class="btn" onclick="openExternal()">↗</button>
    </div>

    <div class="content" id="content">
      <div class="ph" id="ph">エントリを選択</div>
      <div class="ld" id="ld" style="display:none">読み込み中</div>
      <div class="eb" id="eb" style="display:none"></div>
      <div id="panel-raw"></div>
      <div id="panel-info"></div>
    </div>

    <div class="statusbar">
      <span id="st-total">エントリ: —</span>
      <span id="st-last">最終更新: —</span>
      <span id="st-sz"></span>
    </div>
  </div>

</div><!-- /.app-body -->

<script src="app.js"></script>
</body>
</html>
